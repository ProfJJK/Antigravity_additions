[pytest]
pythonpath = src
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    tier1: Tier 1 Feature Coverage tests (happy path in isolation)
    tier2: Tier 2 Boundary and Corner Case tests
    tier3: Tier 3 Cross-Feature Interaction tests (pairwise combinations)
    tier4: Tier 4 Real-World Scenario tests (end-to-end multi-stage flows)
