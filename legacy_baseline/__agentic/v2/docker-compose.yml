{
  "version": "3.8",
  "services": {
    "kanban-worker": {
      "image": "cochem-v2:latest",
      "command": ["sleep", "infinity"],
      "read_only": true,
      "deploy": {
        "replicas": 3,
        "resources": {
          "limits": {
            "cpus": "1.0",
            "memory": "1g"
          }
        }
      },
      "volumes": [
        "cochem-data:/workspace/data"
      ]
    },
    "watchdog": {
      "image": "cochem-v2:latest",
      "command": ["sleep", "infinity"],
      "read_only": true,
      "deploy": {
        "resources": {
          "limits": {
            "cpus": "0.25",
            "memory": "256m"
          }
        }
      },
      "volumes": [
        "cochem-data:/workspace/data"
      ]
    },
    "mcp-server": {
      "image": "cochem-v2:latest",
      "command": ["python", "-m", "http.server", "8787", "--directory", "/opt/cochem/healthroot"],
      "read_only": true,
      "ports": [
        "8787:8787"
      ],
      "deploy": {
        "resources": {
          "limits": {
            "cpus": "0.5",
            "memory": "512m"
          }
        }
      },
      "healthcheck": {
        "test": ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz')"],
        "interval": "10s",
        "timeout": "5s",
        "retries": 3
      },
      "volumes": [
        "cochem-data:/workspace/data"
      ]
    }
  },
  "volumes": {
    "cochem-data": {
      "driver": "local",
      "driver_opts": {
        "type": "none",
        "o": "bind",
        "device": "${COCHEM_ROOT:?set COCHEM_ROOT to the absolute CoChem root}/__agentic/v2/data/"
      }
    }
  }
}
