services:
  kanban-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sleep", "infinity"]
    read_only: true
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    volumes:
      - cochem-data:/workspace/data

  watchdog:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sleep", "infinity"]
    read_only: true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    volumes:
      - cochem-data:/workspace/data

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "http.server", "8787", "--directory", "/opt/cochem/healthroot"]
    read_only: true
    ports:
      - "8787:8787"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8787/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - cochem-data:/workspace/data

volumes:
  cochem-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      # COCHEM_ROOT must be the absolute CoChem root; the local-driver bind requires an absolute host path.
      device: "${COCHEM_ROOT:?set COCHEM_ROOT to the absolute CoChem root}/__agentic/v3/data"
