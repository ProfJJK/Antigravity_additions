name: Pipeline and CLI contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --frozen --extra dev --extra mcp
      - run: uv run --frozen --extra dev --extra mcp python -m pytest pipeline_tests mcp_tests -q --junitxml=contract-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-contract-results
          path: contract-results.xml
      # Windows SYSTEM isolation and subscription inference require the actual
      # provisioned host; Linux contracts never certify those acceptance checks.
