name: Pipeline, CLI and supervisor contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --frozen --extra dev --extra mcp
      - run: uv run --frozen --extra dev --extra mcp python -m pytest pipeline_tests mcp_tests supervisor_tests -q --junitxml=contract-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-contract-results
          path: contract-results.xml
      # Windows SYSTEM isolation and subscription inference require the actual
      # provisioned host; Linux contracts never certify those acceptance checks.

  docker-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --frozen --extra dev --extra mcp
      - name: Build the reviewed offline execution image
        run: |
          python scripts/build_pipeline_sandbox.py > image-build.log
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          image = json.loads(Path('image-build.log').read_text().splitlines()[-1])['image']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', image)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('COCHEM_TEST_DOCKER_IMAGE=' + image + '\n')
          PY
      - name: Execute actual container isolation and failure tests
        run: uv run --frozen --extra dev --extra mcp python -m pytest pipeline_tests/test_containers.py pipeline_tests/test_container_policy.py -q --junitxml=docker-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-execution-results
          path: |
            docker-results.xml
            image-build.log
